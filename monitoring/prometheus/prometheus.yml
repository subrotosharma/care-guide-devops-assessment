global:
  scrape_interval: 15s
  scrape_timeout: 10s
  # Evaluate rules on the same cadence as scraping; a faster interval would
  # only re-read the same samples.
  evaluation_interval: 15s
  external_labels:
    stack: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # The app, addressed by compose service name on the shared monitoring network
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: devops-task

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
