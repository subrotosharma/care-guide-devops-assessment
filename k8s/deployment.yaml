apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task
  labels:
    app.kubernetes.io/name: devops-task
spec:
  replicas: 2
  revisionHistoryLimit: 5 # how far `kubectl rollout undo` can go back
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # a new pod must be Ready before an old one is removed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-task
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: devops-task
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devops-task:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: devops-task-config
            - secretRef:
                name: devops-task-secrets
                optional: true # the service has no secret inputs today; see k8s/README.md
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Endpoints removal and SIGTERM race each other; a short sleep lets the Service
              # stop routing to this pod before uvicorn begins draining.
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
