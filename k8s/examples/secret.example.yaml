# Shape of the Secret the Deployment can consume. NOT applied by kustomization.yaml and
# never filled in here. Create the real one out of band:
#   kubectl -n devops-task create secret generic devops-task-secrets --from-literal=EXAMPLE_TOKEN="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: devops-task-secrets
type: Opaque
stringData:
  EXAMPLE_TOKEN: "<set-out-of-band>"
