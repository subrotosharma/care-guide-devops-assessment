# Needs an ingress controller (kind-config.yaml + ingress-nginx, see k8s/README.md).
# Without one, use `kubectl port-forward svc/devops-task 8080:80` instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task
spec:
  ingressClassName: nginx
  rules:
    - host: devops-task.localtest.me # resolves to 127.0.0.1 without editing /etc/hosts
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task
                port:
                  name: http
