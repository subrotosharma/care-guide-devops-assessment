name: Build, publish and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two releases at once, and never cancel one halfway through a deploy.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov

  publish:
    name: Build and push multi-arch image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute version and image reference
        id: ref
        run: |
          # MAJOR.MINOR is maintained by hand in VERSION; the patch is the run number, so every
          # release on main gets a unique, monotonically increasing semantic version.
          version="$(tr -d '[:space:]' < VERSION).${GITHUB_RUN_NUMBER}"
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "version=${version}"
            echo "repository=ghcr.io/${repo}"
            echo "image=ghcr.io/${repo}:${version}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.repository }}
          # Immutable tags only: semantic version and commit SHA. There is deliberately no
          # "latest": deployments reference an exact version so a rollback is unambiguous.
          tags: |
            type=raw,value=${{ steps.ref.outputs.version }}
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy jobs run only when AWS has been wired up (repository variable AWS_DEPLOY_ENABLED=true),
  # so the pipeline stays green and still publishes images before any infrastructure exists.
  deploy-staging:
    name: Deploy to staging
    needs: publish
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write # request the OIDC token for AWS
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy over SSM (smoke test and automatic rollback run on the host)
        run: scripts/ci/ssm_deploy.sh "${{ vars.EC2_INSTANCE_ID }}" "${{ vars.AWS_REGION }}" "${{ needs.publish.outputs.image }}"
      - name: External smoke test
        if: vars.APP_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "${{ vars.APP_URL }}/health"

  deploy-production:
    name: Deploy to production
    needs: [publish, deploy-staging]
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Configure required reviewers on this GitHub Environment to get a manual approval gate.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy over SSM (smoke test and automatic rollback run on the host)
        run: scripts/ci/ssm_deploy.sh "${{ vars.EC2_INSTANCE_ID }}" "${{ vars.AWS_REGION }}" "${{ needs.publish.outputs.image }}"
      - name: External smoke test
        if: vars.APP_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "${{ vars.APP_URL }}/health"
