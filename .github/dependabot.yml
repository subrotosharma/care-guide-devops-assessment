version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories:
      - "/terraform/bootstrap"
      - "/terraform/environments/*"
      - "/terraform/modules/*"
    schedule: { interval: weekly }
    # Stay on AWS provider 5.x. Moving to 6.x must change every Terraform folder and lock
    # file together, so do it by hand, not as separate per-folder PRs.
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: [">= 6.0.0"]
    groups:
      terraform-providers:
        patterns: ["*"]